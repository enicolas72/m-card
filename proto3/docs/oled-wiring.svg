cx="596" cy="172" r="9" fill="#1d4d30" stroke="#5f9a76"/><text x="596" y="175.5" text-anchor="middle" class="num" fill="#8fc0a2">11</text><circle cx="540" cy="172" r="9" fill="#1d4d30" stroke="#5f9a76"/><text x="540" y="175.5" text-anchor="middle" class="num" fill="#8fc0a2">12</text><circle cx="596" cy="142" r="9" fill="#1d4d30" stroke="#5f9a76"/><text x="596" y="145.5" text-anchor="middle" class="num" fill="#8fc0a2">13</text><circle cx="540" cy="142" r="11" fill="#e84393" stroke="#fff" stroke-width="1.5"/><text x="540" y="145.5" text-anchor="middle" class="num" fill="#fff">14</text><text x="522" y="146" text-anchor="end" font-size="11" font-weight="bold" font-family="monospace" fill="#fff">DC</text><circle cx="596" cy="112" r="11" fill="#8d5a2b" stroke="#fff" stroke-width="1.5"/><text x="596" y="115.5" text-anchor="middle" class="num" fill="#fff">15</text><text x="614" y="116" text-anchor="start" font-size="11" font-weight="bold" font-family="monospace" fill="#fff">RST</text><circle cx="540" cy="112" r="11" fill="#2f9e6e" stroke="#fff" stroke-width="1.5"/><text x="540" y="115.5" text-anchor="middle" class="num" fill="#fff">16</text><text x="522" y="116" text-anchor="end" font-size="11" font-weight="bold" font-family="monospace" fill="#fff">CS</text>

