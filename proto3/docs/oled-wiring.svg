  <rect width="1000" height="850" fill="#fff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#112">M-Card proto 3 — 3.12" OLED wiring (SSD1322, 4-wire SPI)</text>
  <text x="20" y="48" class="note">7 female-female Dupont wires · Raspberry Pi 3 Model B or B+ · the PN532 stays on pins 1–10, the buttons on 29 / 31 / 33 / 39</text>

