  <!-- ===================== Legend / notes ===================== -->
  <rect x="30" y="662" width="940" height="172" class="box" rx="8"/>
  <text x="48" y="686" class="title" font-size="13">Wires (same colour at both ends)</text>
  <g class="label">
    <line x1="48" y1="704" x2="80" y2="704" class="wire" stroke="#e8a33d"/><text x="90" y="708">VDD (screen pin 2) → Pi pin 17 (3.3 V)</text>
    <line x1="48" y1="722" x2="80" y2="722" class="wire" stroke="#333"/><text x="90" y="726">GND (screen pin 1) → Pi pin 20</text>
    <line x1="48" y1="740" x2="80" y2="740" class="wire" stroke="#8e44ad"/><text x="90" y="744">SCLK (screen pin 4) → Pi pin 23 (GPIO11, SPI0 SCLK)</text>
    <line x1="48" y1="758" x2="80" y2="758" class="wire" stroke="#3a7bd5"/><text x="90" y="762">SDIN (screen pin 5) → Pi pin 19 (GPIO10, SPI0 MOSI)</text>
    <line x1="48" y1="776" x2="80" y2="776" class="wire" stroke="#2f9e6e"/><text x="90" y="780">CS (screen pin 16) → Pi pin 24 (GPIO8, SPI0 CE0)</text>
    <line x1="48" y1="794" x2="80" y2="794" class="wire" stroke="#e84393"/><text x="90" y="798">DC (screen pin 14) → Pi pin 18 (GPIO24)</text>
    <line x1="48" y1="812" x2="80" y2="812" class="wire" stroke="#8d5a2b"/><text x="90" y="816">RST (screen pin 15) → Pi pin 22 (GPIO25)</text>
  </g>
  <text x="520" y="686" class="title" font-size="13">Before powering up</text>
  <g class="label">
    <text x="520" y="708">• Wire with the Pi switched off and unplugged.</text>
    <text x="520" y="728">• Audiophonics ships the module set to 4-wire SPI: nothing to change.</text>
    <text x="520" y="748">• VDD on 3.3 V (Pi pin 17), never on 5 V (Pi pins 2 / 4).</text>
    <text x="520" y="768">• Screen pin 1 = GND and pin 2 = VDD: check them twice,</text>
    <text x="532" y="784">a swap can damage the module.</text>
    <text x="520" y="804">• Pin 21 (MISO) stays free: the display is write-only.</text>
    <text x="520" y="824">• Test: proto3/HOWTO.md, section 4 (stop the mcard service first).</text>
  </g>
</svg>
