  <g font-size="10.5" fill="#cfe8d9">
    <text x="652" y="224">This is the side the pins stick out of:</text>
    <text x="652" y="240">plug the wires here, as drawn.</text>
    <text x="652" y="262">Numbers are printed on the display side</text>
    <text x="652" y="278">only: 15 · 16 at one end, 1 · 2 at the other,</text>
    <text x="652" y="294">odd pins in the column next to the glass.</text>
    <text x="652" y="316">Pins 3 and 6–13: not connected.</text>
  </g>
