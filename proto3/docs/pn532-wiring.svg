<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .box { fill:#f4f6f8; stroke:#334; stroke-width:2; }
      .title { font-size:15px; font-weight:bold; fill:#223; }
      .label { font-size:11px; fill:#223; }
      .pin { font-size:10px; fill:#445; font-family:monospace; }
      .num { font-size:10px; font-weight:bold; fill:#fff; font-family:monospace; }
      .wire { fill:none; stroke-width:3.5; stroke-linecap:round; }
      .note { font-size:10.5px; fill:#667; font-style:italic; }
      .frame { fill:none; stroke:#e8a33d; stroke-width:2; stroke-dasharray:5 3; }
    </style>
  </defs>

  <rect width="960" height="620" fill="#fff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#112">M-Card proto 3 — PN532 NFC module wiring</text>
  <text x="20" y="48" class="note">UART (HSU) mode · 4 female-female Dupont wires · Raspberry Pi 3 Model B or B+ (same 40-pin header)</text>

  <!-- ===================== Raspberry Pi overview ===================== -->
  <rect x="30" y="80" width="400" height="263" fill="#2f7d4f" stroke="#1d5233" stroke-width="2" rx="14"/>
  <text x="200" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#e9f5ee">Raspberry Pi 3</text>
  <text x="200" y="233" text-anchor="middle" font-size="10.5" fill="#cfe8d9">top view, components side</text>
  <!-- mounting holes -->
  <g fill="#fff" stroke="#1d5233">
    <circle cx="46" cy="96" r="6"/><circle cx="319" cy="96" r="6"/>
    <circle cx="46" cy="327" r="6"/><circle cx="319" cy="327" r="6"/>
  </g>
  <!-- CPU -->
  <rect x="150" y="250" width="58" height="58" fill="#3a3a3a" stroke="#222"/>
  <!-- USB / Ethernet (right edge) -->
  <g fill="#c9ced3" stroke="#556">
    <rect x="372" y="92" width="72" height="62"/>
    <rect x="372" y="176" width="72" height="62"/>
    <rect x="368" y="262" width="76" height="70"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="408" y="127">USB</text><text x="408" y="211">USB</text><text x="406" y="301">Ethernet</text>
  </g>
  <!-- bottom edge -->
  <rect x="68" y="331" width="34" height="18" fill="#c9ced3" stroke="#556"/>
  <rect x="148" y="327" width="66" height="22" fill="#c9ced3" stroke="#556"/>
  <g class="pin" text-anchor="middle"><text x="85" y="364">power</text><text x="181" y="364">HDMI</text></g>
  <!-- 40-pin header (outer row = even pins along the board edge) -->
  <rect x="62" y="80" width="242" height="28" fill="#222" rx="2"/>
  <g fill="#d8b04a">
    <circle cx="70" cy="88" r="3"/>
    <rect x="66" y="96" width="8" height="8" fill="#ff5"/>
  </g>
  <g fill="#d8b04a" id="hdr">
    <circle cx="82" cy="88" r="3"/><circle cx="94" cy="88" r="3"/><circle cx="106" cy="88" r="3"/><circle cx="118" cy="88" r="3"/>
    <circle cx="130" cy="88" r="3"/><circle cx="142" cy="88" r="3"/><circle cx="154" cy="88" r="3"/><circle cx="166" cy="88" r="3"/>
    <circle cx="178" cy="88" r="3"/><circle cx="190" cy="88" r="3"/><circle cx="202" cy="88" r="3"/><circle cx="214" cy="88" r="3"/>
    <circle cx="226" cy="88" r="3"/><circle cx="238" cy="88" r="3"/><circle cx="250" cy="88" r="3"/><circle cx="262" cy="88" r="3"/>
    <circle cx="274" cy="88" r="3"/><circle cx="286" cy="88" r="3"/><circle cx="298" cy="88" r="3"/>
    <circle cx="82" cy="100" r="3"/><circle cx="94" cy="100" r="3"/><circle cx="106" cy="100" r="3"/><circle cx="118" cy="100" r="3"/>
    <circle cx="130" cy="100" r="3"/><circle cx="142" cy="100" r="3"/><circle cx="154" cy="100" r="3"/><circle cx="166" cy="100" r="3"/>
    <circle cx="178" cy="100" r="3"/><circle cx="190" cy="100" r="3"/><circle cx="202" cy="100" r="3"/><circle cx="214" cy="100" r="3"/>
    <circle cx="226" cy="100" r="3"/><circle cx="238" cy="100" r="3"/><circle cx="250" cy="100" r="3"/><circle cx="262" cy="100" r="3"/>
    <circle cx="274" cy="100" r="3"/><circle cx="286" cy="100" r="3"/><circle cx="298" cy="100" r="3"/>
  </g>
  <rect x="58" y="76" width="74" height="36" class="frame"/>
  <path d="M66 135 L70 106" stroke="#fff" stroke-width="1.5"/>
  <text x="62" y="148" font-size="10.5" fill="#fff">pin 1 (square pad), corner far from the USB ports</text>

  <!-- ===================== Legend / notes ===================== -->
  <rect x="30" y="380" width="400" height="220" class="box" rx="8"/>
  <text x="48" y="404" class="title" font-size="13">Wires</text>
  <g class="label">
    <line x1="48" y1="422" x2="80" y2="422" class="wire" stroke="#e8a33d"/><text x="90" y="426">VCC → pin 1 (3.3 V)</text>
    <line x1="48" y1="442" x2="80" y2="442" class="wire" stroke="#333"/><text x="90" y="446">GND → pin 6</text>
    <line x1="48" y1="462" x2="80" y2="462" class="wire" stroke="#2f9e6e"/><text x="90" y="466">SCL (= RXD) → pin 8 (GPIO14, Pi TXD)</text>
    <line x1="48" y1="482" x2="80" y2="482" class="wire" stroke="#3a7bd5"/><text x="90" y="486">SDA (= TXD) → pin 10 (GPIO15, Pi RXD)</text>
  </g>
  <text x="48" y="514" class="title" font-size="13">Before powering up</text>
  <g class="label">
    <text x="48" y="533">• Both mode switches on 0 = HSU (UART).</text>
    <text x="48" y="551">• 3.3 V only: never pins 2 / 4 (5 V), they sit right next to pin 1.</text>
    <text x="48" y="569">• TX and RX are crossed: the module's TXD goes to the Pi's RXD.</text>
    <text x="48" y="587">• 8-pin header (SCK MISO MOSI SS VCC GND IRQ RSTO): leave unwired.</text>
  </g>

  <!-- ===================== PN532 module ===================== -->
  <rect x="540" y="72" width="260" height="176" fill="#c0392b" stroke="#7d2219" stroke-width="2" rx="6"/>
  <text x="670" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">PN532 NFC module V3</text>
  <text x="670" y="114" text-anchor="middle" font-size="10.5" fill="#f6d5d1">component side</text>
  <rect x="556" y="124" width="140" height="64" fill="none" stroke="#f3c0a0" stroke-width="2" rx="8"/>
  <rect x="564" y="132" width="124" height="48" fill="none" stroke="#f3c0a0" stroke-width="2" rx="6"/>
  <text x="626" y="160" text-anchor="middle" font-size="10" fill="#f6d5d1">antenna</text>
  <!-- mode switches -->
  <rect x="716" y="128" width="64" height="40" fill="#fff" stroke="#7d2219" rx="3"/>
  <rect x="726" y="134" width="16" height="28" fill="#ddd" stroke="#555"/><rect x="728" y="148" width="12" height="12" fill="#333"/>
  <rect x="754" y="134" width="16" height="28" fill="#ddd" stroke="#555"/><rect x="756" y="148" width="12" height="12" fill="#333"/>
  <text x="748" y="182" text-anchor="middle" font-size="10" fill="#fff">switches 0 · 0</text>
  <text x="748" y="194" text-anchor="middle" font-size="10" fill="#fff">= HSU</text>
  <!-- 4-pin header -->
  <rect x="592" y="226" width="156" height="22" fill="#222" rx="2"/>
  <g fill="#d8b04a"><circle cx="610" cy="237" r="5"/><circle cx="650" cy="237" r="5"/><circle cx="690" cy="237" r="5"/><circle cx="730" cy="237" r="5"/></g>
  <g font-size="10.5" font-weight="bold" fill="#fff" text-anchor="middle" font-family="monospace">
    <text x="610" y="219">GND</text><text x="650" y="219">VCC</text><text x="690" y="219">SDA</text><text x="730" y="219">SCL</text>
  </g>
  <g font-size="9.5" fill="#f6d5d1" text-anchor="middle" font-family="monospace">
    <text x="690" y="207">TXD</text><text x="730" y="207">RXD</text>
  </g>
  <text x="820" y="240" class="note">4-pin header</text>
  <text x="820" y="253" class="note">(solder this one)</text>

  <!-- ===================== Header detail ===================== -->
  <rect x="470" y="330" width="470" height="270" class="box" rx="8"/>
  <rect x="478" y="338" width="454" height="254" class="frame"/>
  <text x="492" y="580" class="note">Framed area of the Pi header, enlarged (pins 1 to 12)</text>
  <text x="916" y="384" text-anchor="end" class="note">outer row</text>
  <text x="916" y="396" text-anchor="end" class="note">(board edge)</text>
  <text x="916" y="444" text-anchor="end" class="note">inner row</text>

  <!-- wires (drawn under the pins) -->
  <path class="wire" stroke="#e8a33d" d="M650 243 C650 300, 498 300, 498 360 L498 440 L518 440"/>
  <path class="wire" stroke="#333" d="M610 243 C610 310, 650 310, 650 368"/>
  <path class="wire" stroke="#2f9e6e" d="M730 243 C730 300, 710 320, 710 368"/>
  <path class="wire" stroke="#3a7bd5" d="M690 243 C690 312, 770 300, 770 368"/>

  <!-- outer row: even pins -->
  <g>
    <circle cx="530" cy="380" r="12" fill="#e74c3c" stroke="#7d2219" stroke-width="1.5"/><text x="530" y="384" text-anchor="middle" class="num">2</text>
    <circle cx="590" cy="380" r="12" fill="#e74c3c" stroke="#7d2219" stroke-width="1.5"/><text x="590" y="384" text-anchor="middle" class="num">4</text>
    <circle cx="650" cy="380" r="12" fill="#333" stroke="#000" stroke-width="1.5"/><text x="650" y="384" text-anchor="middle" class="num">6</text>
    <circle cx="710" cy="380" r="12" fill="#2f9e6e" stroke="#1d5233" stroke-width="1.5"/><text x="710" y="384" text-anchor="middle" class="num">8</text>
    <circle cx="770" cy="380" r="12" fill="#3a7bd5" stroke="#1f4f91" stroke-width="1.5"/><text x="770" y="384" text-anchor="middle" class="num">10</text>
    <circle cx="830" cy="380" r="12" fill="#ccc" stroke="#888" stroke-width="1.5"/><text x="830" y="384" text-anchor="middle" class="num">12</text>
  </g>
  <g class="pin" text-anchor="middle">
    <text x="530" y="406" fill="#c0392b">5V ✗</text>
    <text x="590" y="406" fill="#c0392b">5V ✗</text>
    <text x="650" y="406">GND</text>
    <text x="710" y="406">GPIO14</text><text x="710" y="417">TXD</text>
    <text x="770" y="406">GPIO15</text><text x="770" y="417">RXD</text>
    <text x="830" y="406" fill="#999">GPIO18</text>
  </g>

  <!-- inner row: odd pins -->
  <g>
    <rect x="518" y="428" width="24" height="24" fill="#e8a33d" stroke="#9a6514" stroke-width="1.5"/><text x="530" y="444" text-anchor="middle" class="num">1</text>
    <circle cx="590" cy="440" r="12" fill="#ccc" stroke="#888" stroke-width="1.5"/><text x="590" y="444" text-anchor="middle" class="num">3</text>
    <circle cx="650" cy="440" r="12" fill="#ccc" stroke="#888" stroke-width="1.5"/><text x="650" y="444" text-anchor="middle" class="num">5</text>
    <circle cx="710" cy="440" r="12" fill="#ccc" stroke="#888" stroke-width="1.5"/><text x="710" y="444" text-anchor="middle" class="num">7</text>
    <circle cx="770" cy="440" r="12" fill="#ccc" stroke="#888" stroke-width="1.5"/><text x="770" y="444" text-anchor="middle" class="num">9</text>
    <circle cx="830" cy="440" r="12" fill="#ccc" stroke="#888" stroke-width="1.5"/><text x="830" y="444" text-anchor="middle" class="num">11</text>
  </g>
  <g class="pin" text-anchor="middle">
    <text x="530" y="468">3V3</text>
    <text x="590" y="468" fill="#999">GPIO2</text>
    <text x="650" y="468" fill="#999">GPIO3</text>
    <text x="710" y="468" fill="#999">GPIO4</text>
    <text x="770" y="468" fill="#999">GND</text>
    <text x="830" y="468" fill="#999">GPIO17</text>
  </g>
  <text x="706" y="510" text-anchor="middle" class="label">Pins 17–24 are reserved for the OLED (SPI) — see HOWTO.md.</text>
  <text x="706" y="528" text-anchor="middle" class="label">Buttons stay on pins 29 / 31 / 33 and GND 39.</text>
</svg>
