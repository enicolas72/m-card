    <circle cx="230" cy="410" r="11" fill="#d5d9de" stroke="#a3aab3" stroke-width="1.5"/><text x="230" y="413.5" text-anchor="middle" class="num" fill="#7a828c">7</text>
    <circle cx="230" cy="340" r="11" fill="#2f9e6e" stroke="#223" stroke-width="1.5"/><text x="230" y="343.5" text-anchor="middle" class="num" fill="#fff">8</text><text x="230" y="364" text-anchor="middle" class="pl" fill="#223">TXD</text><text x="230" y="375" text-anchor="middle" class="pl sub" fill="#223">PN532</text>
    <circle cx="270" cy="410" r="11" fill="#d5d9de" stroke="#a3aab3" stroke-width="1.5"/><text x="270" y="413.5" text-anchor="middle" class="num" fill="#7a828c">9</text>
    <circle cx="270" cy="340" r="11" fill="#3a7bd5" stroke="#223" stroke-width="1.5"/><text x="270" y="343.5" text-anchor="middle" class="num" fill="#fff">10</text><text x="270" y="364" text-anchor="middle" class="pl" fill="#223">RXD</text><text x="270" y="375" text-anchor="middle" class="pl sub" fill="#223">PN532</text>
