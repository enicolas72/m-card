    <circle cx="670" cy="340" r="11" fill="#d5d9de" stroke="#a3aab3" stroke-width="1.5"/><text x="670" y="343.5" text-anchor="middle" class="num" fill="#7a828c">30</text>
    <circle cx="710" cy="410" r="11" fill="#0e9aa7" stroke="#223" stroke-width="1.5"/><text x="710" y="413.5" text-anchor="middle" class="num" fill="#fff">31</text><text x="710" y="434" text-anchor="middle" class="pl" fill="#223">play</text><text x="710" y="445" text-anchor="middle" class="pl sub" fill="#223">GPIO6</text>
