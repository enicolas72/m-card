<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .box { fill:#f4f6f8; stroke:#334; stroke-width:2; }
      .title { font-size:15px; font-weight:bold; fill:#223; }
      .label { font-size:11px; fill:#223; }
      .note { font-size:10.5px; fill:#667; font-style:italic; }
      .num { font-size:10px; font-weight:bold; font-family:monospace; }
      .pl { font-size:10px; font-family:monospace; paint-order:stroke; stroke:#f4f6f8; stroke-width:3px; stroke-linejoin:round; }
      .sub { font-size:9.5px; font-style:italic; font-family:Helvetica, Arial, sans-serif; }
      .mod { font-size:10.5px; font-weight:bold; fill:#fff; font-family:monospace; }
      .modsub { font-size:9px; fill:#cfd8e3; font-family:monospace; }
      .wire { fill:none; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="1000" height="720" fill="#fff"/>
  <text x="20" y="30" font-size="19" font-weight="bold" fill="#112">M-Card proto 3 — wiring overview</text>
  <text x="20" y="48" class="note">Raspberry Pi 3 (B or B+) · female-female Dupont wires · module details: pn532-wiring.svg, oled-wiring.svg</text>

  <!-- PN532 -->
  <rect x="40" y="66" width="200" height="170" fill="#c0392b" stroke="#7d2219" stroke-width="2" rx="6"/>
  <text x="140" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">PN532 NFC V3</text>
  <text x="140" y="106" text-anchor="middle" font-size="10" fill="#f6d5d1">UART (HSU), switches 0 · 0</text>
  <rect x="64" y="118" width="152" height="54" fill="none" stroke="#f3c0a0" stroke-width="2" rx="6"/>
  <text x="140" y="149" text-anchor="middle" font-size="10" fill="#f6d5d1">antenna</text>
  <rect x="62" y="212" width="156" height="20" fill="#222" rx="2"/>
  <circle cx="80" cy="222" r="5" fill="#d8b04a"/><text x="80" y="208" text-anchor="middle" class="mod">GND</text><circle cx="120" cy="222" r="5" fill="#d8b04a"/><text x="120" y="208" text-anchor="middle" class="mod">VCC</text><circle cx="160" cy="222" r="5" fill="#d8b04a"/><text x="160" y="208" text-anchor="middle" class="mod">SDA</text><circle cx="200" cy="222" r="5" fill="#d8b04a"/><text x="200" y="208" text-anchor="middle" class="mod">SCL</text><text x="160" y="196" text-anchor="middle" class="modsub">TXD</text><text x="200" y="196" text-anchor="middle" class="modsub">RXD</text>

  <!-- OLED -->
  <rect x="340" y="66" width="320" height="170" fill="#1b2a3a" stroke="#0c141c" stroke-width="2" rx="6"/>
  <rect x="356" y="78" width="288" height="96" fill="#000" stroke="#444" rx="3"/>
  <text x="500" y="100" text-anchor="middle" font-size="10" fill="#fff">M-Card</text>
  <text x="500" y="136" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">Place an album</text>
  <text x="500" y="162" text-anchor="middle" font-size="9.5" fill="#8a9bb0">OLED 3.12" 256×64 (SSD1322), SPI · 7 of its 16 pins</text>
  <rect x="360" y="212" width="280" height="20" fill="#111" rx="2"/>
  <circle cx="380" cy="222" r="5" fill="#d8b04a"/><text x="380" y="198" text-anchor="middle" class="mod">VDD</text><text x="380" y="210" text-anchor="middle" class="modsub">pin 2</text><circle cx="420" cy="222" r="5" fill="#d8b04a"/><text x="420" y="198" text-anchor="middle" class="mod">DC</text><text x="420" y="210" text-anchor="middle" class="modsub">pin 14</text><circle cx="460" cy="222" r="5" fill="#d8b04a"/><text x="460" y="198" text-anchor="middle" class="mod">SDIN</text><text x="460" y="210" text-anchor="middle" class="modsub">pin 5</text><circle cx="500" cy="222" r="5" fill="#d8b04a"/><text x="500" y="198" text-anchor="middle" class="mod">GND</text><text x="500" y="210" text-anchor="middle" class="modsub">pin 1</text><circle cx="540" cy="222" r="5" fill="#d8b04a"/><text x="540" y="198" text-anchor="middle" class="mod">RST</text><text x="540" y="210" text-anchor="middle" class="modsub">pin 15</text><circle cx="580" cy="222" r="5" fill="#d8b04a"/><text x="580" y="198" text-anchor="middle" class="mod">CS</text><text x="580" y="210" text-anchor="middle" class="modsub">pin 16</text><circle cx="620" cy="222" r="5" fill="#d8b04a"/><text x="620" y="198" text-anchor="middle" class="mod">SCLK</text><text x="620" y="210" text-anchor="middle" class="modsub">pin 4</text>

  <!-- Pin use summary -->
  <rect x="690" y="66" width="280" height="170" class="box" rx="8"/>
  <text x="708" y="90" class="title" font-size="13">Pin use</text>
  <g class="label">
    <text x="708" y="112">PN532 (UART): 1 · 6 · 8 · 10</text>
    <text x="708" y="132">OLED (SPI0): 17 · 18 · 19 · 20 · 22 · 23 · 24</text>
    <text x="708" y="152">Buttons: 29 · 31 · 33, common GND 39</text>
    <text x="708" y="172" fill="#c0392b">Never the 5 V pins 2 · 4</text>
    <text x="708" y="192">Pin 21 (MISO) free: display is write-only</text>
    <text x="708" y="212">Free: I2C 3 · 5 (no LCD any more), others</text>
  </g>

  <!-- Raspberry Pi -->
  <rect x="60" y="292" width="890" height="232" fill="#2f7d4f" stroke="#1d5233" stroke-width="2" rx="14"/>
  <rect x="84" y="306" width="812" height="160" fill="#f4f6f8" stroke="#1d5233" rx="6"/>
  <g fill="#c9ced3" stroke="#556">
    <rect x="906" y="312" width="52" height="44"/><rect x="906" y="366" width="52" height="44"/><rect x="902" y="420" width="56" height="52"/>
  </g>
  <g font-size="9" fill="#223" text-anchor="middle"><text x="932" y="338">USB</text><text x="932" y="392">USB</text><text x="930" y="450">Eth</text></g>
  <text x="380" y="492" text-anchor="middle" font-size="15" font-weight="bold" fill="#e9f5ee">Raspberry Pi 3 — 40-pin header, top view</text>
  <text x="380" y="510" text-anchor="middle" font-size="10.5" fill="#cfe8d9">top row = board edge (even pins) · pin 1 = square pad, far from the USB ports</text>
  <rect x="150" y="518" width="40" height="14" fill="#c9ced3" stroke="#556"/>

  <!-- Power -->
  <rect x="40" y="580" width="250" height="90" class="box" rx="8"/>
  <text x="165" y="604" text-anchor="middle" class="title" font-size="13">USB-C socket (rear)</text>
  <text x="165" y="622" text-anchor="middle" class="label">external 5 V / 3 A charger</text>
  <text x="165" y="640" text-anchor="middle" class="label">→ micro-USB into the Pi</text>
  <path class="wire" stroke="#c0392b" d="M170 580 L170 534"/>

  <!-- Buttons -->
  <rect x="330" y="562" width="620" height="136" class="box" rx="8"/>
  <text x="350" y="588" class="title" font-size="13">Buttons (12 mm)</text>
  <text x="350" y="606" class="note">momentary, to GND (internal pull-ups)</text>
  <text x="350" y="624" class="note">faceplate, bottom to top: prev, play/pause, next</text>
  <!-- wires (under the pins) -->
    <path class="wire" stroke="#333" d="M80 228 C80 283, 190 265, 190 329"/>
  <path class="wire" stroke="#e8a33d" d="M120 228 C120 283, 90 265, 90 310 L90 410 L99 410"/>
  <path class="wire" stroke="#3a7bd5" d="M160 228 C160 283, 270 265, 270 329"/>
  <path class="wire" stroke="#2f9e6e" d="M200 228 C200 283, 230 265, 230 329"/>
  <path class="wire" stroke="#e8a33d" d="M380 228 C380 283, 410 265, 410 310 L410 410 L419 410"/>
  <path class="wire" stroke="#e84393" d="M420 228 C420 283, 430 265, 430 329"/>
  <path class="wire" stroke="#3a7bd5" d="M460 228 C460 283, 450 265, 450 310 L450 410 L459 410"/>
  <path class="wire" stroke="#333" d="M500 228 C500 283, 470 265, 470 329"/>
  <path class="wire" stroke="#8d5a2b" d="M540 228 C540 283, 510 265, 510 329"/>
  <path class="wire" stroke="#2f9e6e" d="M580 228 C580 283, 550 265, 550 329"/>
  <path class="wire" stroke="#8e44ad" d="M620 228 C620 283, 570 265, 570 310 L570 410 L561 410"/>
  <path class="wire" stroke="#0e9aa7" d="M681 410 L690 410 L690 470 C690 540, 670 530, 670 596"/>
  <path class="wire" stroke="#0e9aa7" d="M721 410 L730 410 L730 470 C730 540, 740 530, 740 596"/>
  <path class="wire" stroke="#0e9aa7" d="M761 410 L770 410 L770 470 C770 540, 810 530, 810 596"/>
  <path class="wire" stroke="#333" d="M670 628 L670 660 L810 660 L810 628 M740 628 L740 660 M810 660 L890 660 L890 410 L881 410"/>

  <g>
    <rect x="99" y="399" width="22" height="22" fill="#e8a33d" stroke="#223" stroke-width="1.5"/><text x="110" y="413.5" text-anchor="middle" class="num" fill="#fff">1</text><text x="110" y="434" text-anchor="middle" class="pl" fill="#223">3V3</text><text x="110" y="445" text-anchor="middle" class="pl sub" fill="#223">PN532</text>
    <circle cx="110" cy="340" r="11" fill="#e74c3c" stroke="#7d2219" stroke-width="1.5"/><text x="110" y="343.5" text-anchor="middle" class="num" fill="#fff">2</text><text x="110" y="364" text-anchor="middle" class="pl" fill="#c0392b">5V ✗</text>
    <circle cx="150" cy="410" r="11" fill="#d5d9de" stroke="#a3aab3" stroke-width="1.5"/><text x="150" y="413.5" text-anchor="middle" class="num" fill="#7a828c">3</text>
    <circle cx="150" cy="340" r="11" fill="#e74c3c" stroke="#7d2219" stroke-width="1.5"/><text x="150" y="343.5" text-anchor="middle" class="num" fill="#fff">4</text><text x="150" y="364" text-anchor="middle" class="pl" fill="#c0392b">5V ✗</text>
    <circle cx="190" cy="410" r="11" fill="#d5d9de" stroke="#a3aab3" stroke-width="1.5"/><text x="190" y="413.5" text-anchor="middle" class="num" fill="#7a828c">5</text>
