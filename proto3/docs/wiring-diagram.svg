    <circle cx="550" cy="410" r="11" fill="#8e44ad" stroke="#223" stroke-width="1.5"/><text x="550" y="413.5" text-anchor="middle" class="num" fill="#fff">23</text><text x="550" y="434" text-anchor="middle" class="pl" fill="#223">SCLK</text><text x="550" y="445" text-anchor="middle" class="pl sub" fill="#223">OLED</text>
    <circle cx="550" cy="340" r="11" fill="#2f9e6e" stroke="#223" stroke-width="1.5"/><text x="550" y="343.5" text-anchor="middle" class="num" fill="#fff">24</text><text x="550" y="364" text-anchor="middle" class="pl" fill="#223">CS</text><text x="550" y="375" text-anchor="middle" class="pl sub" fill="#223">CE0</text>
    <circle cx="590" cy="410" r="11" fill="#d5d9de" stroke="#a3aab3" stroke-width="1.5"/><text x="590" y="413.5" text-anchor="middle" class="num" fill="#7a828c">25</text>
    <circle cx="590" cy="340" r="11" fill="#d5d9de" stroke="#a3aab3" stroke-width="1.5"/><text x="590" y="343.5" text-anchor="middle" class="num" fill="#7a828c">26</text>
    <circle cx="630" cy="410" r="11" fill="#d5d9de" stroke="#a3aab3" stroke-width="1.5"/><text x="630" y="413.5" text-anchor="middle" class="num" fill="#7a828c">27</text>
