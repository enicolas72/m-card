    <circle cx="470" cy="410" r="11" fill="#3a7bd5" stroke="#223" stroke-width="1.5"/><text x="470" y="413.5" text-anchor="middle" class="num" fill="#fff">19</text><text x="470" y="434" text-anchor="middle" class="pl" fill="#223">MOSI</text><text x="470" y="445" text-anchor="middle" class="pl sub" fill="#223">OLED</text>
    <circle cx="470" cy="340" r="11" fill="#333" stroke="#223" stroke-width="1.5"/><text x="470" y="343.5" text-anchor="middle" class="num" fill="#fff">20</text><text x="470" y="364" text-anchor="middle" class="pl" fill="#223">GND</text><text x="470" y="375" text-anchor="middle" class="pl sub" fill="#223">OLED</text>
    <circle cx="510" cy="410" r="11" fill="#d5d9de" stroke="#a3aab3" stroke-width="1.5"/><text x="510" y="413.5" text-anchor="middle" class="num" fill="#7a828c">21</text>
